shadow_mode_metrics:
  ros__parameters:
    ego_speed_topic: /shadow/ego/speed
    ego_curvature_topic: /shadow/ego/curvature
    virtual_steering_topic: /shadow/virtual/steering_proxy
    virtual_curvature_topic: /shadow/virtual/curvature
    virtual_warning_topic: /shadow/virtual/warning_score
    wheelbase: 2.7
    publish_rate_hz: 10.0
    max_signal_age_sec: 0.5
    steering_delta_warn_rad: 0.2
    curvature_delta_warn_inv_m: 0.1
    steering_delta_weight: 0.5
    curvature_delta_weight: 0.3
    virtual_warning_weight: 0.2
    publish_invalid_summaries: false
    enable_csv_logging: false
    csv_path: Data/metrics/shadow_mode_metrics.csv
