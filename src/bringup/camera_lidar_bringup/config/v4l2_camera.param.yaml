/**:
  ros__parameters:
    # Default profile for TIER IV Automotive HDR Camera C2.
    # Keep the default lighter than the full 2880x1860 C2 mode for live GUI/E2E use.
    video_device: /dev/video0
    pixel_format: UYVY
    output_encoding: rgb8
    image_size: [1920, 1280]
    camera_frame_id: camera0
    time_per_frame: [1, 30]
