e2e_path_overlay:
  ros__parameters:
    image_topic: /sensing/camera/camera0/image_rect_color
    image_fallback_topics:
      - /sensing/camera/camera0/image_rect_color
      - /image_rect_color
    camera_info_topic: /sensing/camera/camera0/camera_info
    path_topic: /shadow/e2e/path
    lane_path_topic: /shadow/perception/lane_path
    yolo_detections_topic: /yolo/detections
    output_image_topic: /shadow/e2e/overlay_image
    output_compressed_image_topic: /shadow/e2e/overlay_image/compressed
    output_compressed_jpeg_quality: 80
    output_status_topic: /shadow/e2e/overlay_status
    model_input_image_topic: /shadow/e2e/model_input_image
    model_input_width_px: 1152
    model_input_height_px: 384
    model_input_layout: front_center_stitched
    model_input_camera_count: 3
    model_input_front_camera_slot: 1
    model_input_crop_to_slot_aspect: true
    yolo_input_image_topic: /shadow/perception/yolo_input_image
    yolo_input_width_px: 960
    yolo_input_height_px: 640
    lane_input_image_topic: /shadow/perception/lane_input_image
    lane_input_camera_info_topic: /shadow/perception/lane_input_camera_info
    lane_input_width_px: 640
    lane_input_height_px: 427
    synthesize_camera_info_when_missing: false
    synthetic_camera_info_focal_length_px: 0.0
    synthetic_camera_info_frame_id: ""
    output_max_edge_px: 640
    process_rate_hz: 10.0
    stale_image_timeout_sec: 0.5
    publish_status_every_frame: true
    use_tf_translation: true
    camera_x_m: 1.2
    camera_y_m: 0.1
    camera_z_m: 1.35
    min_depth_m: 0.5
    max_depth_m: 80.0
    path_style: comma
    path_ribbon_width_m: 2.8
    path_ribbon_color_rgb: [0, 210, 120]
    path_edge_color_rgb: [180, 255, 210]
    path_ribbon_alpha_near: 0.62
    path_ribbon_alpha_far: 0.22
    path_edge_width_px: 2
    line_width_px: 5
    line_color_rgb: [0, 255, 80]
    point_radius_px: 3
    draw_waypoints: false
    draw_lane_path: true
    lane_path_line_width_px: 4
    lane_path_outline_width_px: 2
    lane_path_ribbon_width_m: 0.0
    lane_path_color_rgb: [80, 220, 255]
    lane_path_outline_color_rgb: [0, 0, 0]
    draw_yolo_boxes: true
    yolo_min_score: 0.25
    yolo_box_width_px: 3
    yolo_box_color_rgb: [255, 220, 0]
    stale_path_timeout_sec: 1.0
    stale_lane_path_timeout_sec: 1.0
    stale_yolo_timeout_sec: 1.0
    stale_camera_info_timeout_sec: 2.0
