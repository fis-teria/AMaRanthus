camera_lane_detection:
  ros__parameters:
    enabled: true
    backend: opencv_onnx
    model_path: ""
    image_topic: /sensing/camera/camera0/image_rect_color
    camera_info_topic: /sensing/camera/camera0/camera_info
    output_path_topic: /shadow/perception/lane_path
    status_topic: /shadow/perception/lane_status
    output_frame: base_link
    max_process_rate_hz: 5.0
    input_width: 512
    input_height: 288
    input_scale: 0.00392156862745098
    input_mean_rgb: [0.0, 0.0, 0.0]
    input_std_rgb: [1.0, 1.0, 1.0]
    mask_threshold: 0.5
    lane_class_ids: [1]
    shoulder_class_ids: [2]
    roi_top_ratio: 0.45
    roi_bottom_ratio: 0.98
    path_points: 10
    path_forward_min_m: 3.0
    path_forward_max_m: 25.0
    assumed_lane_width_m: 3.5
    fallback_horizontal_fov_deg: 70.0
    min_mask_pixels_per_band: 12
    publish_status_every_frame: true
